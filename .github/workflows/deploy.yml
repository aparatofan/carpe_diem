---
# Deploys the plugin to the live site over FTPS whenever main changes.
#
# How it stays fast: the action keeps a sync-state file
# (.ftp-deploy-sync-state.json) inside the server directory, listing the hash of
# every file it has uploaded. Each run compares the repo against that file and
# uploads only what actually changed. The first run is the slow one: with no
# state file it uploads everything. Do not delete that file on the server;
# losing it forces another full upload.
#
# Copied from the TBT drag-and-drop plugin's deploy, which has proven reliable.
#
# Differences from the TBT version:
# - The server directory comes from the FTP_SERVER_DIR secret, because this
#   site's FTP account starts above public_html, so the full path is needed:
#   /public_html/autoinstalator/mariuszmirecki.pl/wordpress129219/wp-content/plugins/simple-daily-calendar/
#   A missing leading or trailing slash is added automatically. The folder must
#   stay the installed plugin folder, and simple-daily-calendar.php must keep
#   its name — see the preflight below.
# - A PHP syntax check runs before anything is uploaded. A syntax error in an
#   active plugin takes the whole site down.
#
# Note also that this action uploads but never deletes. A file removed from the
# repository stays on the server; that is harmless for an asset nothing enqueues
# any more, but it is why the main plugin file must never be renamed — two main
# files in one folder would show WordPress two plugins.

name: Deploy to WordPress

on:
  push:
    branches: [ main ]
    # Documentation-only commits do not need an FTP round trip. If every file in
    # the push matches one of these, the workflow is skipped entirely.
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — log what would be uploaded, change nothing on the server'
        type: boolean
        default: false
      # Diagnostics. Pushes always use the defaults; these only apply to a
      # manual run, so experimenting here cannot change how a merge deploys.
      protocol:
        description: 'Connection type — try "ftp" to test whether TLS is what the data channel is choking on'
        type: choice
        default: ftps
        options: [ ftps, ftp, ftps-legacy ]
      port:
        description: 'Port (21 for ftp/ftps, 990 for ftps-legacy)'
        type: string
        default: '21'
      log_level:
        description: 'Log detail — "verbose" prints every FTP command and reply'
        type: choice
        default: standard
        options: [ standard, verbose ]
      allow_create:
        description: 'Allow deploying into a folder that does not hold the plugin yet (genuine first install only)'
        type: boolean
        default: false

# Two FTP syncs running at once would race on the same sync-state file and can
# corrupt it. Queue them instead — and never cancel a run mid-upload, which
# would leave the server half-updated.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTPS upload
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # Fail fast with a readable message rather than letting the FTP client
      # report a confusing connection error thirty seconds in.
      - name: Verify the secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Normalise to /path/ so the preflight and the upload see the same folder.
          dir="$(printf '%s' "$FTP_SERVER_DIR" | tr -d '\r\n' | sed -e 's#^[[:space:]]*##' -e 's#[[:space:]]*$##')"
          case "$dir" in /*) ;; *) dir="/$dir" ;; esac
          case "$dir" in */) ;; *) dir="$dir/" ;; esac
          echo "::add-mask::$dir"
          echo "FTP_SERVER_DIR=$dir" >> "$GITHUB_ENV"

      # The deploy client creates any directory it cannot find, so a wrong
      # server directory does not fail — it silently rebuilds the path as a new
      # tree and reports success, while the live site never changes. Refuse to
      # deploy unless the target already looks like the installed plugin.
      - name: Verify the target is the installed plugin folder
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROTOCOL: ${{ inputs.protocol || 'ftps' }}
          PORT: ${{ inputs.port || '21' }}
          ALLOW_CREATE: ${{ inputs.allow_create || false }}
        run: |
          if [ "true" = "$ALLOW_CREATE" ]; then
            echo "allow_create is set — skipping the target check."
            exit 0
          fi

          case "$PROTOCOL" in
            ftps-legacy) url_scheme="ftps"; tls_flag="" ;;
            ftps)        url_scheme="ftp";  tls_flag="--ssl-reqd" ;;
            *)           url_scheme="ftp";  tls_flag="" ;;
          esac

          # FTP_SERVER_DIR starts with "/", so putting another "/" before it
          # yields the "//" curl needs to read the path as absolute — the same
          # way the deploy action's client resolves it. Without that the two can
          # disagree about which directory they are talking about.
          target_url="$url_scheme://$FTP_SERVER:$PORT/$FTP_SERVER_DIR"

          if ! listing=$( curl -sS --insecure $tls_flag --connect-timeout 30 \
                            --user "$FTP_USERNAME:$FTP_PASSWORD" \
                            --list-only "$target_url" 2>&1 ); then
            echo "::error::Cannot list ${FTP_SERVER_DIR}. It probably does not exist as the deploy account sees it — which means the deploy would silently CREATE it and upload into a folder WordPress never loads. A deploy-only FTP account is often chrooted deeper than your desktop client. curl said: ${listing}"
            exit 1
          fi

          if ! printf '%s\n' "$listing" | tr -d '\r' | grep -qE '(^|/)simple-daily-calendar\.php$'; then
            echo "::error::${FTP_SERVER_DIR} exists but does not contain simple-daily-calendar.php, so it is not the installed plugin folder. Uploading there would leave the live site untouched. Set allow_create for a genuine first-time install."
            exit 1
          fi

          echo "Target verified: simple-daily-calendar.php is present, this is the installed plugin folder."

      # A syntax error in an active plugin is a fatal error on every page of the
      # site, so check every PHP file before anything leaves GitHub.
      - name: Check PHP syntax
        run: |
          for f in $(git ls-files '*.php'); do
            php -l "$f" >/dev/null || { echo "::error file=$f::PHP syntax error — nothing was uploaded."; exit 1; }
          done
          echo "PHP syntax OK."

      # The preflight above logs in, lists, and disconnects. Opening a second
      # FTP session in the same second has coincided with the server resetting
      # the data connection, so give it a moment to release the first one
      # before the upload starts.
      - name: Let the preflight's FTP session close
        run: sleep 15

      - name: Sync changed files to the server
        id: sync
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          local-dir: ./
          # A push supplies no inputs, so these fall back to the safe defaults.
          protocol: ${{ inputs.protocol || 'ftps' }}
          port: ${{ inputs.port || '21' }}
          # `loose` skips certificate validation. The transfer is still
          # encrypted, but it will not verify the server's identity — which is
          # what makes it work on shared hosts using a self-signed or
          # mismatched certificate. If your host presents a valid certificate,
          # change this to `strict` for a properly authenticated connection.
          security: loose
          log-level: ${{ inputs.log_level || 'standard' }}
          # Never wipe the remote directory. A clean slate here would delete
          # anything on the server that is not in the repo.
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run || false }}
          # Specifying `exclude` replaces the action's defaults, so the .git and
          # node_modules patterns have to be repeated here.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules
            **/*.md
            *.md
            .github/**

      # The upload client does not retry ECONNRESET — its retry only covers FTP
      # reply codes 400-499, and it saves its sync state only after a completed
      # run, so one reset loses the whole attempt. This host resets connections
      # intermittently, so give it a second go rather than failing the deploy.
      - name: Wait out the reset before retrying
        if: steps.sync.outcome == 'failure'
        run: |
          echo "First attempt failed — waiting 60s before retrying."
          sleep 60

      - name: Retry the sync
        if: steps.sync.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          local-dir: ./
          protocol: ${{ inputs.protocol || 'ftps' }}
          port: ${{ inputs.port || '21' }}
          security: loose
          log-level: ${{ inputs.log_level || 'standard' }}
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules
            **/*.md
            *.md
            .github/**
